<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuron Silencing Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap">
<style>
  :root {
    --bg: #f4f3ef; --fg: #1d1c1a; --muted: #6c675f; --rule: #dcd8cf; --card: #ffffff;
    --accent: #2457c5; --tab-hover: #e8e6df;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151513; --fg: #ecebe6; --muted: #a39e94; --rule: #34322d; --card: #ffffff;
      --accent: #86a8ff; --tab-hover: #24231f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151513; --fg: #ecebe6; --muted: #a39e94; --rule: #34322d; --card: #ffffff;
    --accent: #86a8ff; --tab-hover: #24231f;
    color-scheme: dark;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--rule);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  [role="tablist"] { max-width: 1280px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  [role="tab"] {
    font: inherit; font-size: 0.95rem; font-weight: 500; letter-spacing: 0.02em; color: var(--muted);
    background: none; border: 0; border-bottom: 2px solid transparent; padding: 14px 16px 12px; cursor: pointer; white-space: nowrap;
  }
  [role="tab"]:hover { color: var(--fg); background: var(--tab-hover); }
  [role="tab"][aria-selected="true"] { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }
  [role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  main {
    max-width: 1280px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 40px;
  }
  .frame { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; overflow: auto; min-width: 0; }
  .frame img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  .frame.zoomed img { width: auto; max-width: none; cursor: zoom-out; }
  video { display: block; width: 100%; height: auto; max-width: 100%; border-radius: 10px; background: #000; }
</style>
</head>
<body>
<header>
  <nav role="tablist" aria-label="Results">
    <button role="tab" data-tab="summary">Summary</button>
    <button role="tab" data-tab="ads1046">ADS1046</button>
    <button role="tab" data-tab="rim">RIM</button>
    <button role="tab" data-tab="aiy">AIY</button>
    <button role="tab" data-tab="aib">AIB</button>
    <button role="tab" data-tab="rib-video">RIB video</button>
    <button role="tab" data-tab="ava-video">AVA video</button>
  </nav>
</header>
<main>
  <section role="tabpanel" id="summary"><div class="frame"><img src="img/summary.png" alt="Expected vs observed effects of silencing each neuron on plates with a gradient"></div></section>
  <section role="tabpanel" id="ads1046" hidden><div class="frame"><img src="img/ads1046.png" alt="ADS1046 with and without histamine: main figure"></div></section>
  <section role="tabpanel" id="rim" hidden><div class="frame"><img src="img/rim.png" alt="RIM silencing: main figure"></div></section>
  <section role="tabpanel" id="aiy" hidden><div class="frame"><img src="img/aiy.png" alt="AIY silencing: main figure"></div></section>
  <section role="tabpanel" id="aib" hidden><div class="frame"><img src="img/aib.png" alt="AIB silencing: main figure"></div></section>
  <section role="tabpanel" id="rib-video" hidden>
    <video src="media/rib_control_vs_silenced.mp4" poster="media/rib_poster.jpg" controls muted playsinline preload="metadata"
           aria-label="RIB control and silenced plates with an odor gradient, side by side, 15 times real time"></video>
  </section>
  <section role="tabpanel" id="ava-video" hidden>
    <video src="media/ava_control_vs_silenced.mp4" poster="media/ava_poster.jpg" controls muted playsinline preload="metadata"
           aria-label="AVA control and silenced plates with an odor gradient, side by side, 15 times real time"></video>
  </section>
</main>

<script>
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  const videos = [...document.querySelectorAll("video")];
  function show(id) {
    tabs.forEach(t => {
      const on = t.dataset.tab === id;
      t.setAttribute("aria-selected", on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.dataset.tab).hidden = !on;
    });
    videos.forEach(v => { if (!document.getElementById(id).contains(v)) v.pause(); });
  }
  tabs.forEach((t, i) => {
    t.addEventListener("click", () => {
      show(t.dataset.tab);
      try { history.replaceState(null, "", "#" + t.dataset.tab); } catch (e) {}
    });
    t.addEventListener("keydown", e => {
      const step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (!step) return;
      const next = tabs[(i + step + tabs.length) % tabs.length];
      next.focus();
      next.click();
    });
  });
  document.querySelectorAll(".frame").forEach(f => f.addEventListener("click", () => f.classList.toggle("zoomed")));
  const start = location.hash.slice(1);
  show(tabs.some(t => t.dataset.tab === start) ? start : "summary");
</script>
</body>
</html>
